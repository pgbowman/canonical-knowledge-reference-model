<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- background -->
  <rect width="1200" height="675" fill="#fafaf8"/>

  <!-- title -->
  <text x="600" y="170" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="56" font-weight="bold" fill="#1a1a1a"
        letter-spacing="-0.5">
    Canonical Knowledge Systems
  </text>

  <!-- subtitle -->
  <text x="600" y="220" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#555555"
        letter-spacing="0.5">
    Source-aware AI workflows
  </text>

  <!-- diagram row, vertically centered at y = 400 -->

  <!-- Sources -->
  <rect x="80" y="360" width="200" height="80"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="180" y="408" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#1a1a1a">Sources</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="400" x2="350" y2="400"
        stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="350,400 340,395 340,405" fill="#1a1a1a"/>

  <!-- Claims -->
  <rect x="360" y="360" width="200" height="80"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="460" y="408" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#1a1a1a">Claims</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="400" x2="630" y2="400"
        stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="630,400 620,395 620,405" fill="#1a1a1a"/>

  <!-- Interpretations -->
  <rect x="640" y="360" width="200" height="80"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="740" y="408" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#1a1a1a">Interpretations</text>

  <!-- Arrow 3 -->
  <line x1="850" y1="400" x2="910" y2="400"
        stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="910,400 900,395 900,405" fill="#1a1a1a"/>

  <!-- Evaluation -->
  <rect x="920" y="360" width="200" height="80"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1020" y="408" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#1a1a1a">Evaluation</text>

  <!-- footer -->
  <text x="600" y="600" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" fill="#888888">
    A reference model for reviewable AI outputs
  </text>
</svg>
